name: Checks
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: homework_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make install-dev
      - run: make format-check
      - run: make test
        env:
          MYSQL_TEST_DSN: "root:ci-test-only@tcp(127.0.0.1:3306)/homework_ci?charset=utf8mb4&parseTime=True&loc=UTC"
      - run: go vet ./...
        working-directory: backend
